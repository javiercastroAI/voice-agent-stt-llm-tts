name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Validate scaffold and specs
        run: python3 scripts/generate-contract-artifacts.py --check && python3 scripts/validate-specs.py && ./scripts/check-scaffold.sh

      - name: Validate generated FSM business graph
        run: python3 scripts/generate-fsm-graph.py --check

      - name: Build
        run: python3 -m compileall voice_agent backend shared tests

      - name: Test
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Replay deterministic FSM adherence scenarios
        run: python3 scripts/evaluate-fsm-adherence.py --scenario-only

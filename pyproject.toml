[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "A LiveKit-based voice agent using OpenAI and Silero."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6.11,<2.0.0",
    "livekit-agents[openai,silero]>=1.3.6",
    "openai>=2.31.0,<3.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_agent*", "backend*", "shared*"]
